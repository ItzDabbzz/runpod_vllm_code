name: Build, test, and push Docker image

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: "1"

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image names
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REF_SAFE=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr '/' '-')

          echo "REPO_LC=$REPO_LC" >> $GITHUB_ENV
          echo "REF_SAFE=$REF_SAFE" >> $GITHUB_ENV

      - name: Docker info
        run: docker info

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build --pull \
            -t ghcr.io/${REPO_LC}:${GITHUB_SHA} \
            .

      - name: Start test container
        run: |
          docker run -d \
            --name test-container \
            -e CODE_SERVER_PASSWORD="ci-test-password" \
            -p 18443:8443 \
            ghcr.io/${REPO_LC}:${GITHUB_SHA}

      - name: Wait for healthcheck
        run: |
          for i in $(seq 1 60); do
            if docker exec test-container curl -fsS http://127.0.0.1:8443/healthz; then
              echo "Container healthcheck passed"
              exit 0
            fi

            if [ "$i" = "60" ]; then
              echo "Container healthcheck failed"
              docker logs test-container
              exit 1
            fi

            sleep 2
          done

      - name: Show logs
        if: always()
        run: docker logs test-container || true

      - name: Remove test container
        if: always()
        run: docker rm -f test-container 2>/dev/null || true

      - name: Tag branch image
        if: github.ref_type == 'branch'
        run: |
          docker tag ghcr.io/${REPO_LC}:${GITHUB_SHA} ghcr.io/${REPO_LC}:${REF_SAFE}

      - name: Push SHA image
        run: |
          docker push ghcr.io/${REPO_LC}:${GITHUB_SHA}

      - name: Push branch image
        if: github.ref_type == 'branch'
        run: |
          docker push ghcr.io/${REPO_LC}:${REF_SAFE}

      - name: Push latest (default branch only)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          docker tag ghcr.io/${REPO_LC}:${GITHUB_SHA} ghcr.io/${REPO_LC}:latest
          docker push ghcr.io/${REPO_LC}:latest